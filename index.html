<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Gear 2 - SNES</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0c0c0c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 15px;
            font-size: 1.5rem;
            color: #ff3333;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        #game {
            width: 800px;
            height: 600px;
            max-width: 95vw;
            max-height: 85vh;
            border: 4px solid #333;
            background-color: #000;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Top Gear 2 - SNES</h1>
    <div id="game"></div>

    <script>
        // Monta automaticamente a URL correta da ROM hospedada no seu repositório
        const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
        
        EJS_player = '#game';
        EJS_core = 'snes'; // Core de Super Nintendo
        EJS_gameUrl = basePath + 'Top_Gear_2.sfc'; // Garanta que seu arquivo se chama exatamente Top_Gear_2.sfc
        
        // Caminho da CDN oficial estável do EmulatorJS (Corrige o bloqueio de carregamento)
        EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        EJS_startOnLoaded = true;
    </script>
    
    <!-- Loader vindo da infraestrutura oficial dedicada -->
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
