<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SNES Online - Top Gear 2</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #emulator {
            width: 100%;
            height: 100%;
        }

        #fullscreen-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(225, 0, 50, 0.85); /* Vermelho combinando com a identidade do Top Gear 2 */
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            z-index: 99999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        #fullscreen-btn:active {
            transform: scale(0.95);
            background: #cc0022;
        }

        #error-msg {
            display: none;
            color: #fff;
            text-align: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #ff4444;
            z-index: 100000;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <button id="fullscreen-btn" onclick="toggleFullscreen()">🔲 TELA CHEIA</button>

        <div id="error-msg">
            <h3>ROM não encontrada!</h3>
            <p>Certifique-se de que o arquivo <b>topgear2.sfc</b> está no seu repositório do GitHub.</p>
        </div>
        
        <div id="emulator"></div>
    </div>

    <script>
        EJS_player = '#emulator';
        EJS_core = 'snes';
        EJS_gameName = 'Top Gear 2';
        EJS_color = '#e10032'; // Nova cor do tema para o Top Gear 2
        EJS_gameUrl = 'topgear2.sfc'; // Nome do arquivo atualizado para buscar a ROM correta
        EJS_pathtodata = 'https://emulatorjs.org';

        function toggleFullscreen() {
            const container = document.getElementById('game-container');
            
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.msFullscreenElement) {
                
                if (container.requestFullscreen) {
                    container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                    container.msRequestFullscreen();
                }
                
                document.getElementById('fullscreen-btn').innerText = "🔳 SAIR";
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
                
                document.getElementById('fullscreen-btn').innerText = "🔲 TELA CHEIA";
            }
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                document.getElementById('fullscreen-btn').innerText = "🔲 TELA CHEIA";
            }
        });
    </script>

    <script src="https://emulatorjs.orgloader.js"></script>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetch(EJS_gameUrl, { method: 'HEAD' })
                .then(response => {
                    if (!response.ok) document.getElementById('error-msg').style.display = 'block';
                })
                .catch(() => {
                    document.getElementById('error-msg').style.display = 'block';
                });
        });
    </script>

</body>
</html>
